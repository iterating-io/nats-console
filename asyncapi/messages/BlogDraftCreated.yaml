info:
  title: Blog draft created message
  version: 1.0.0

components:
  messages:
    BlogDraftCreated:
      name: BlogDraftCreated
      title: Blog draft created
      summary: Identifies a new draft and the desired state of its image objects.
      payload:
        $ref: '../schemas/BlogDraftCreatedPayload.yaml#/components/schemas/BlogDraftCreatedPayload'
      examples:
        - name: draftCreated
          payload:
            eventId: 5f6149eb-8d42-4ea2-b811-33d7e253ca9c
            draftId: 26
            imageSet:
              bucket: dev.blog.iterating.io
              path: public/draft/26/
              objects:
                - 3b50f728-0d96-436e-ab42-033c00e3468d.png
