services:
    nats:
        image: nats:2.11-alpine
        command: ["-c", "/etc/nats/nats.conf", "-m", "8222"]
        volumes:
            - ./nats.conf:/etc/nats/nats.conf:ro
            - ./auth.conf:/etc/nats/auth.conf:ro
            - nats-resolver:/data/nats/resolver
        ports:
            - "4222:4222"
            - "8222:8222"

    app:
        build:
            context: ..
            dockerfile: deploy/dockerfile.console
            args:
                WEB_BASE_PATH: ${WEB_BASE_PATH:-/}
        environment:
            NATS_URL: "${NATS_APP_URL:?NATS_APP_URL must be exported by direnv}"
            NATS_SYS_JWT: "${NATS_SYS_JWT:?NATS_SYS_JWT must be exported by direnv}"
            NATS_SYS_NKEY: "${NATS_SYS_NKEY:?NATS_SYS_NKEY must be exported by direnv}"
            OPERATOR_NKEY: "${OPERATOR_NKEY:?OPERATOR_NKEY must be exported by direnv}"
            ADMIN_ID: "${ADMIN_ID:?ADMIN_ID must be exported by direnv}"
            ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be exported by direnv}"
            ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
            DB_PATH: "/app/data/console.db"
        ports:
            - "9222:9222"
        volumes:
            - console-data:/app/data
        depends_on:
            - nats

volumes:
    nats-resolver:
    console-data:
